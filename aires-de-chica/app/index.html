<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Aires de Chicá · App</title>
<link rel="icon" href="../brand/favicon.svg"/>
<link rel="stylesheet" href="../brand/palette.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:var(--ac-font);background:var(--ac-bg);color:var(--ac-ink)}
header{background:linear-gradient(120deg,#0B7A98,#12A2C4);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header img{height:40px;background:#fff;border-radius:8px;padding:4px 6px}
header h1{font-size:1rem;margin:0} header .sub{font-size:.72rem;opacity:.85}
.grad{height:4px;background:linear-gradient(90deg,var(--ac-teal),var(--ac-green) 60%,var(--ac-coral))}
.pad{padding:14px 16px 40px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:12px 14px;box-shadow:var(--ac-shadow)}
.card .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ac-muted);font-weight:600}
.card .val{font-size:1.35rem;font-weight:700;margin-top:2px}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--ac-border);border-radius:10px;font:inherit;margin-bottom:12px}
.row{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--ac-shadow)}
.row .lote{font-weight:700;min-width:44px}
.row .nm{flex:1;min-width:0} .row .nm b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:.75rem;color:var(--ac-muted)}
.row .sal{text-align:right} .row .sal b{font-size:.95rem}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700}
.pill.ok{background:#e4f5ec;color:var(--ac-ok)} .pill.warn{background:#fbf0dc;color:var(--ac-warn)} .pill.red{background:#fbe6e3;color:var(--ac-danger)}
.badge{background:#F4A45C;color:#4a2410;font-weight:700;font-size:.68rem;padding:3px 8px;border-radius:20px;margin-left:auto}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(16,48,57,.45);display:none;z-index:40}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;z-index:41;transform:translateY(100%);transition:.25s}
.sheet.show{transform:translateY(0)}
.sheet .sh{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid var(--ac-border);display:flex;justify-content:space-between;align-items:flex-start}
.sheet .sb{padding:14px 16px 30px}
table{width:100%;border-collapse:collapse;font-size:.85rem} td,th{padding:7px 6px;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} th{font-size:.68rem;color:var(--ac-muted);text-transform:uppercase}
tr{border-bottom:1px solid #eef5f8}
.close{border:0;background:none;font-size:1.5rem;color:var(--ac-muted)}
.tot{display:flex;justify-content:space-between;padding:10px 12px;background:var(--ac-teal-50);border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<header>
  <img src="../brand/logo.png" alt="Aires de Chicá"/>
  <div><h1>Aires de Chicá</h1><div class="sub">Estados de cuenta · 2026</div></div>
  <span class="badge" id="badge">Demo</span>
</header>
<div class="grad"></div>
<div class="pad">
  <div class="summary" id="summary"></div>
  <input type="search" id="q" placeholder="Buscar lote o propietario…"/>
  <div id="list"></div>
</div>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grad"></div>
  <div class="sh" id="sheetHd"></div><div class="sb" id="sheetBd"></div></div>

<script src="../brand/seed-demo.js"></script>
<script>
const GAS_URL=''; const DEMO=!GAS_URL;
const ANIO=2026,HOY=new Date('2026-07-13');
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CUOTA_BASE=45,CABANA=13.5,MORA_PCT=.10,MORA_DESDE=2026*12+4;
const money=n=>'B/.'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((Number(n)||0)*100)/100;
function calcEstado(p){
  const cuota=r2(p.cuota||(p.lotes*CUOTA_BASE+p.cabanas*CABANA));
  const mesActual=HOY.getMonth()+1, buckets=[];
  if(p.saldo2025>0)buckets.push({label:'Saldo 2025',year:2025,month:12,monto:r2(p.saldo2025),tipo:'s'});
  for(let m=1;m<=mesActual;m++)buckets.push({label:MESES[m-1],year:ANIO,month:m,monto:cuota,tipo:'c'});
  let rem=r2((p.pagos||[]).reduce((a,b)=>a+(+b||0),0)),saldo=0,mora=0,oldest=null;
  buckets.forEach(b=>{const ap=Math.min(rem,b.monto);b.pagado=r2(ap);b.saldo=r2(b.monto-ap);rem=r2(rem-ap);b.mora=0;
    if(b.saldo>0&&b.tipo==='c'&&(b.year*12+b.month)>=MORA_DESDE){const ml=Math.max(0,(HOY.getFullYear()*12+HOY.getMonth()+1)-(b.year*12+b.month));b.mora=r2(b.saldo*MORA_PCT*ml);}
    if(b.saldo>0){saldo+=b.saldo;mora+=b.mora;if(!oldest)oldest=b;}});
  saldo=r2(saldo);mora=r2(mora);const scm=r2(saldo+mora);
  let dias=0;if(oldest){const v=new Date(oldest.year,oldest.month,0);dias=Math.max(0,Math.floor((HOY-v)/864e5));}
  const estado=scm>0.009?(dias>0?'Moroso':'Pendiente'):'Al día';
  return {...p,cuota,buckets,pagado:r2((p.pagos||[]).reduce((a,b)=>a+(+b||0),0)),saldo,mora,saldoConMora:scm,creditoAFavor:r2(rem),diasVencido:dias,estado};
}
function jsonp(action,params={}){return new Promise((res,rej)=>{const cb='__cb'+Math.random().toString(36).slice(2);
  const qs=Object.entries({action,...params,callback:cb}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const s=document.createElement('script');s.src=GAS_URL+'?'+qs;window[cb]=d=>{delete window[cb];s.remove();d.ok?res(d.data):rej(d.error)};s.onerror=()=>{s.remove();rej('net')};document.body.appendChild(s);});}

let CUENTAS=[];
async function load(){
  if(DEMO){ CUENTAS=window.AC_DEMO_SEED.map(calcEstado); }
  else { document.getElementById('badge').style.display='none'; const d=await jsonp('getDashboard'); CUENTAS=d.cuentas; }
  const con=CUENTAS.filter(c=>c.saldoConMora>0.009).length;
  const cartera=r2(CUENTAS.reduce((a,c)=>a+c.saldoConMora,0));
  document.getElementById('summary').innerHTML=
    `<div class="card"><div class="label">Por cobrar</div><div class="val" style="color:var(--ac-coral)">${money(cartera)}</div></div>
     <div class="card"><div class="label">Cuentas con saldo</div><div class="val">${con} / ${CUENTAS.length}</div></div>`;
  draw();
}
const pill=e=>e.estado==='Al día'?'<span class="pill ok">Al día</span>':e.estado==='Pendiente'?'<span class="pill warn">Pendiente</span>':'<span class="pill red">Moroso</span>';
function draw(){
  const q=document.getElementById('q').value.toLowerCase();
  const rows=CUENTAS.filter(c=>!q||c.nombre.toLowerCase().includes(q)||String(c.lote).toLowerCase().includes(q))
    .sort((a,b)=>b.saldoConMora-a.saldoConMora);
  document.getElementById('list').innerHTML=rows.map((c,i)=>`<div class="row" onclick="openSheet('${c.clave}')">
    <div class="lote">${c.lote}</div><div class="nm"><b>${c.nombre}</b><span>${c.residencial}</span></div>
    <div class="sal"><b>${money(c.saldoConMora)}</b><div>${pill(c)}</div></div></div>`).join('')
    || '<p style="color:var(--ac-muted)">Sin resultados.</p>';
}
document.getElementById('q').oninput=draw;
async function openSheet(clave){
  const e = DEMO ? CUENTAS.find(c=>c.clave===clave) : await jsonp('getEstadoCuenta',{clave});
  const color=e.saldoConMora>0.009?(e.diasVencido>0?'var(--ac-danger)':'var(--ac-warn)'):'var(--ac-ok)';
  document.getElementById('sheetHd').innerHTML=`<div><div style="font-weight:700">${e.nombre}</div>
    <div style="font-size:.78rem;color:var(--ac-muted)">${e.residencial} · Lote ${e.lote} · Cuota ${money(e.cuota)}</div></div>
    <button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML=`
    <table><thead><tr><th>Mes</th><th class="n">Cuota</th><th class="n">Saldo</th><th class="n">Mora</th></tr></thead>
    <tbody>${e.buckets.map(b=>`<tr><td>${b.label}</td><td class="n">${money(b.monto)}</td>
      <td class="n">${b.saldo>0.009?money(b.saldo):'<span style="color:var(--ac-ok)">Pagado</span>'}</td>
      <td class="n" style="color:var(--ac-coral)">${b.mora>0.009?money(b.mora):'—'}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><b>SALDO TOTAL</b><b style="color:${color}">${money(e.saldoConMora)}</b></div>
    ${DEMO?'<p style="color:var(--ac-muted);font-size:.8rem;margin-top:12px">Modo demostración.</p>':
      `<button style="margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac-teal);color:#fff;font:inherit;font-weight:600" onclick="mail('${e.clave}')" ${e.email?'':'disabled'}>Enviar estado de cuenta por correo</button>`}`;
  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){document.getElementById('sheetBg').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
async function mail(clave){try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'enviarEstado',clave})});const j=await r.json();alert(j.ok&&j.data.enviado?'Enviado':'No enviado');}catch(e){alert('Error: '+e);}}
load();
</script>
</body>
</html>
