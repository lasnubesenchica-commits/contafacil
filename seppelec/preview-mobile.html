<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seppelec CxC — Móvil (propuesta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#E05A00; --orange2:#CC5200;
  --bg:#F2F2F4; --bg2:#EBEBED; --border:rgba(0,0,0,0.10);
  --text:#0A0A0A; --muted:#6C6C70; --chrome:#AEAEB2; --white:#FFFFFF;
  --azul:#1565C0; --azul-bg:#E3F2FD;
  --verde:#1B7A33; --verde-bg:#E3F6E8;
  --morado:#7B1FA2; --morado-bg:#F4E7FA;
  --rojo:#D32F2F; --rojo-bg:#FDE7E7;
  --rojoosc:#7A0C0C; --rojoosc-bg:#F6D6D6;
  --amar:#9A6A00; --amar-bg:#FFF6DB;
  --gris:#6C6C70; --gris-bg:#ECECEE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
.phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(242,242,244,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:.7rem .9rem}
.brand{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.04em;line-height:1}
.brand span{color:var(--orange)}
.brand small{display:block;font-family:'DM Sans';font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.15rem}
.bstat{display:flex;gap:.5rem;font-size:.6rem;font-weight:600;color:var(--muted);margin-top:.35rem}
.bstat .ok{color:var(--verde)}
.note{background:#FFF6DB;border-bottom:1px solid #E6CF7A;color:#7A5A00;font-size:.68rem;padding:.45rem .9rem;text-align:center}

.wrap{padding:.8rem .9rem 5rem}

/* tarjetas de línea de crédito */
.lcards{display:grid;gap:.6rem;margin-bottom:.9rem}
.lc{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:.7rem .8rem;position:relative;overflow:hidden}
.lc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.lc.reg::before{background:var(--orange)} .lc.ext::before{background:var(--morado)}
.lc .t{font-family:'Bebas Neue';font-size:1.05rem;letter-spacing:.03em;display:flex;align-items:center;gap:.4rem}
.lc .t .tope{margin-left:auto;font-size:.56rem;font-weight:700;color:#fff;border-radius:100px;padding:.15rem .45rem}
.lc.reg .t .tope{background:var(--orange)} .lc.ext .t .tope{background:var(--morado)}
.lc .big{font-family:'DM Mono',monospace;font-size:1.35rem;font-weight:500;margin:.2rem 0 .1rem}
.lc .lbl{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bar{height:9px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:.4rem 0 .2rem}
.bar i{display:block;height:100%}
.lc.reg .bar i{background:var(--orange)} .lc.ext .bar i{background:var(--morado)}
.lc .mini{display:flex;justify-content:space-between;font-size:.58rem;color:var(--muted)}
.lc .duo{display:flex;gap:.8rem;margin-top:.5rem}
.lc .duo div{flex:1}
.lc .duo .v{font-family:'DM Mono',monospace;font-size:.92rem;font-weight:600}

/* filtros */
.filters{display:flex;gap:.4rem;margin-bottom:.7rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fbtn{flex:0 0 auto;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--white);
  border:1px solid var(--border);border-radius:100px;padding:.4rem .8rem}
.fbtn.on{background:var(--text);color:#fff;border-color:var(--text)}
.fbtn.on.reg{background:var(--orange);border-color:var(--orange)}
.fbtn.on.ext{background:var(--morado);border-color:var(--morado)}
.sech{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:.9rem .15rem .4rem}

/* tarjeta de factura/orden */
.mcard{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:.7rem .8rem;margin-bottom:.55rem;position:relative;overflow:hidden}
.mcard.ext{box-shadow:inset 4px 0 0 var(--morado)}
.mc-r1{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem}
.mc-code{font-weight:700;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.mc-code .po{color:var(--muted);font-weight:500;font-size:.76rem}
.badge-ext{font-size:.5rem;font-weight:800;color:var(--morado);background:var(--morado-bg);border:1px solid rgba(123,31,162,.3);padding:.05rem .25rem;border-radius:4px}
.st{font-size:.6rem;font-weight:700;padding:.18rem .5rem;border-radius:100px;white-space:nowrap}
.st-orden{background:var(--gris-bg);color:var(--gris)} .st-facturado{background:var(--azul-bg);color:var(--azul)}
.st-abonado{background:var(--amar-bg);color:var(--amar)} .st-pagado{background:var(--verde-bg);color:var(--verde)}
.st-vencido{background:var(--rojoosc-bg);color:var(--rojoosc)}
.mc-r2{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.mc-monto{font-family:'DM Mono',monospace;font-size:1.15rem;font-weight:600}
.mc-due{font-size:.7rem;color:var(--muted);text-align:right}
.mc-due b{font-weight:700}
.mc-due .rojo{color:var(--rojo)} .mc-due .rojoosc{color:var(--rojoosc)} .mc-due .verde{color:var(--verde)}
/* mini barra de tiempo */
.tl{position:relative;height:16px;margin-top:.5rem}
.tl .track{position:absolute;left:7px;right:7px;top:50%;transform:translateY(-50%);height:6px;border-radius:4px;background:var(--bg2)}
.tl .fill{position:absolute;top:50%;transform:translateY(-50%);height:6px;border-radius:4px}
.f-fact{background:var(--azul-bg);border:1px solid rgba(21,101,192,.4)}
.f-ext{background:var(--morado-bg);border:1px solid rgba(123,31,162,.4)}
.f-venc{background:var(--rojoosc-bg);border:1px solid rgba(122,12,12,.4)}
.f-pago{background:var(--verde-bg);border:1px solid rgba(27,122,51,.4)}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700;color:#fff}
.mk.emis{width:9px;height:9px;background:var(--azul)} .mk.emisx{width:9px;height:9px;background:var(--morado)}
.mk.due{background:var(--rojo)} .mk.venc{background:var(--rojoosc)} .mk.pago{background:var(--verde)}
.tl .hoy{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--orange)}
.mc-pill{display:inline-block;font-size:.62rem;font-weight:600;color:var(--gris);background:var(--gris-bg);border-radius:100px;padding:.12rem .5rem;margin-top:.45rem}

/* modal detalle */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.45);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:1.1rem 1.1rem 1.6rem;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-size:1rem;margin-bottom:.1rem;word-break:break-word}
.sheet .sub{font-size:.72rem;color:var(--muted);margin-bottom:.9rem}
.di{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;font-size:.86rem}
.di .k{color:var(--muted)} .di .v{font-family:'DM Mono',monospace;text-align:right;font-weight:500}
.sheet .x{margin-top:1.1rem;display:flex;gap:.5rem}
.btn{flex:1;font-size:.85rem;font-weight:700;border:1px solid var(--border);background:#fff;border-radius:100px;padding:.7rem;text-align:center}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.fab{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;padding:.7rem .9rem;background:linear-gradient(180deg,rgba(242,242,244,0),var(--bg) 35%);display:flex;gap:.5rem;z-index:20}
.fab button{flex:1;font-size:.8rem;font-weight:700;border-radius:100px;padding:.8rem;border:1px solid var(--border);background:#fff}
.fab .up{background:var(--orange);color:#fff;border-color:var(--orange)}
</style>
</head>
<body>
<div class="phone">
  <div class="hd">
    <div class="brand">SEPPELEC<span> · CxC</span><small>Cuentas por cobrar · móvil</small></div>
    <div class="bstat"><span class="ok">● Sincronizado</span><span>·</span><span>🔓 Editando</span></div>
  </div>
  <div class="note">Propuesta de vista móvil (demostración). Toca una tarjeta para ver el detalle.</div>

  <div class="wrap">
    <div class="lcards" id="lcards"></div>
    <div class="filters" id="filters">
      <button class="fbtn on" data-l="all">Todas</button>
      <button class="fbtn reg" data-l="regular">Regular</button>
      <button class="fbtn ext" data-l="extra">Extraordinaria</button>
    </div>
    <div id="list"></div>
  </div>

  <div class="fab">
    <button class="up">⬆ Subir OC / Factura</button>
    <button>📊 Resumen</button>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h3 id="mTitle"></h3><div class="sub" id="mSub"></div>
  <div class="di" id="mInfo"></div>
  <div class="x"><button class="btn" onclick="closeM()">Cerrar</button><button class="btn primary">Editar estado</button></div>
</div></div>

<script>
const YEAR=2026, PLAZO=60;
const TODAY=new Date(2026,5,23);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ESTADO={orden:'Orden',facturado:'Facturado',abonado:'Abonado',pagado:'Pagado'};
const ROWS=[
 {po:'4200001894/4200001909/4200001974',inv:'F26155',fInv:'2026-04-07',monto:54626.78,estado:'pagado',fPago:'2026-05-18',abonado:54626.78,linea:'regular',pagoUrl:'#'},
 {po:'4200001507-4200001866',inv:'F26069',fInv:'2026-02-23',monto:25003.47,estado:'pagado',fPago:'2026-05-11',abonado:25003.47,linea:'regular'},
 {po:'4200001700',inv:'F26100',fInv:'2026-03-01',monto:12000,estado:'facturado',fPago:'',abonado:0,linea:'regular'},
 {po:'4200002008',inv:'F26225',fInv:'2026-05-14',monto:28179.52,estado:'facturado',fPago:'',abonado:0,linea:'regular'},
 {po:'4200002297',inv:'F26247',fInv:'2026-05-25',monto:11297.40,estado:'facturado',fPago:'',abonado:0,linea:'regular'},
 {po:'4200002014',inv:'F26248',fInv:'2026-05-26',monto:24528.66,estado:'abonado',fPago:'2026-06-10',abonado:10000,linea:'regular'},
 {po:'4200002051',inv:'F26283',fInv:'2026-06-15',monto:2301.02,estado:'facturado',fPago:'',abonado:0,linea:'extra'},
 {po:'4200002286',inv:'F26281',fInv:'2026-06-22',monto:6696.30,estado:'facturado',fPago:'',abonado:0,linea:'extra'},
 {po:'4200001983',inv:'F26284',fInv:'2026-06-18',monto:9607.69,estado:'facturado',fPago:'',abonado:0,linea:'extra'},
 {po:'4200001955',inv:'',fInv:'',monto:24014.58,estado:'orden',fPago:'',abonado:0,linea:'regular'},
 {po:'4200002056',inv:'',fInv:'',monto:10239.40,estado:'orden',fPago:'',abonado:0,linea:'regular'},
 {po:'4200002052',inv:'',fInv:'',monto:28325.64,estado:'orden',fPago:'',abonado:0,linea:'regular'},
 {po:'4200002382',inv:'',fInv:'',monto:17548.75,estado:'orden',fPago:'',abonado:0,linea:'extra'}
];
let FILTER='all';
const parseD=s=>{ if(!s)return null; const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const money=n=>'$'+Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const money2=n=>'$'+Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fday=d=>d?(('0'+d.getDate()).slice(-2)+'-'+MES[d.getMonth()]):'—';
const isExt=r=>r.linea==='extra';
function comp(r){ const fInv=parseD(r.fInv), due=fInv?addD(fInv,PLAZO):null, fPago=parseD(r.fPago);
  const pag=r.estado==='pagado'?r.monto:(r.estado==='abonado'?(+r.abonado||0):0);
  const pend=Math.max(0,(r.monto||0)-pag); const overdue=due?(due<TODAY&&pend>0.005):false;
  const fact=(r.estado==='facturado'||r.estado==='abonado'||r.estado==='pagado')&&!!fInv;
  return {fInv,due,fPago,pag,pend,overdue,fact}; }

function lineCards(){
  function agg(fn){ let f=0,p=0,porc=0,venc=0,cons=0,ord=0; ROWS.forEach(r=>{ if(!fn(r))return; const c=comp(r);
    if(c.fact)f+=r.monto; p+=c.pag; if(c.fact&&c.pend>0.005){cons+=c.pend; c.overdue?venc+=c.pend:porc+=c.pend;} if(r.estado==='orden')ord+=r.monto; });
    return {f,p,porc,venc,cons,ord}; }
  const reg=agg(r=>!isExt(r)), ext=agg(r=>isExt(r)), tope=70000;
  const card=(cls,name,a)=>{ const disp=tope-a.cons, pct=Math.max(0,Math.min(100,a.cons/tope*100));
    return `<div class="lc ${cls}"><div class="t">${name}<span class="tope">Tope ${money(tope)}</span></div>
      <div class="lbl">Saldo disponible</div><div class="big" style="color:${disp<0?'var(--rojo)':(cls==='ext'?'var(--morado)':'var(--verde)')}">${money2(disp)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="mini"><span>Consumido ${money(a.cons)}</span><span>Cupo ${money(tope)}</span></div>
      <div class="duo"><div><div class="lbl">Por cobrar</div><div class="v" style="color:${cls==='ext'?'var(--morado)':'var(--rojo)'}">${money(a.porc+a.venc)}</div></div>
      <div><div class="lbl">${cls==='ext'?'Abonado/pagado':'Pagado'}</div><div class="v" style="color:var(--verde)">${money(a.p)}</div></div></div></div>`; };
  document.getElementById('lcards').innerHTML = card('reg','Regular',reg)+card('ext','Extraordinaria',ext);
}

function bar(r,c){
  if(!c.fact) return `<span class="mc-pill">orden · sin facturar</span>`;
  const ext=isExt(r);
  if(r.estado==='pagado'){ return `<div class="tl"><div class="track"></div>
    <div class="fill f-pago" style="left:7px;right:7px"></div>
    <span class="mk ${ext?'emisx':'emis'}" style="left:7px"></span><span class="mk pago" style="right:0px">✓</span></div>`; }
  const x0=7, span='calc(100% - 14px)';
  const total=c.due-c.fInv; let hoyF=(TODAY-c.fInv)/total; hoyF=Math.max(0,Math.min(1,hoyF));
  const fillCls=c.overdue?'f-venc':(ext?'f-ext':'f-fact');
  const dueCls=c.overdue?'venc':'due';
  return `<div class="tl"><div class="track"></div>
    <div class="fill ${fillCls}" style="left:7px;right:7px"></div>
    <span class="mk ${ext?'emisx':'emis'}" style="left:7px"></span>
    <span class="mk ${dueCls}" style="right:0px">${c.overdue?'!':'◆'}</span>
    <div class="hoy" style="left:calc(7px + (100% - 14px) * ${hoyF})"></div></div>`;
}

function list(){
  const rows=ROWS.map((r,i)=>({r,i,c:comp(r)})).filter(o=> FILTER==='all'||o.r.linea===(FILTER));
  rows.sort((a,b)=>{ const ra=a.r.estado==='orden'?2:(a.c.pend<=0.005?1:0), rb=b.r.estado==='orden'?2:(b.c.pend<=0.005?1:0);
    if(ra!==rb)return ra-rb; const da=a.c.due?a.c.due.getTime():9e15, db=b.c.due?b.c.due.getTime():9e15; return da-db; });
  let html=''; let lastSec='';
  rows.forEach(({r,i,c})=>{
    const sec = r.estado==='orden'?'Órdenes sin facturar':(c.pend<=0.005&&c.fact?'Pagadas':'Por cobrar');
    if(sec!==lastSec){ html+=`<div class="sech">${sec}</div>`; lastSec=sec; }
    const est=c.overdue?'vencido':r.estado;
    let dueTxt='';
    if(r.estado==='orden') dueTxt='—';
    else if(c.pend<=0.005) dueTxt=`<span class="verde">✓ pagada ${fday(c.fPago)}</span>`;
    else { const dd=Math.round((c.due-TODAY)/864e5);
      dueTxt = c.overdue?`<span class="rojoosc">venció ${fday(c.due)} · <b>${Math.abs(dd)}d</b></span>`:`vence ${fday(c.due)} · <b class="${dd<=15?'rojo':''}">${dd}d</b>`; }
    html+=`<div class="mcard ${isExt(r)?'ext':''}" onclick="detail(${i})">
      <div class="mc-r1"><span class="mc-code">${r.inv||'—'} <span class="po">${r.po}</span></span>
        ${isExt(r)?'<span class="badge-ext">EXT</span>':''}<span class="st st-${est}">${c.overdue?'Vencido':ESTADO[r.estado]}</span></div>
      <div class="mc-r2"><span class="mc-monto">${money2(r.monto)}</span><span class="mc-due">${dueTxt}</span></div>
      ${bar(r,c)}</div>`;
  });
  document.getElementById('list').innerHTML=html||'<div class="sech">Sin registros</div>';
}
function detail(i){ const r=ROWS[i], c=comp(r);
  document.getElementById('mTitle').innerHTML=(r.inv||'—')+(isExt(r)?' <span class="badge-ext">EXT</span>':'');
  document.getElementById('mSub').textContent=r.po;
  let dias='—'; if(c.due&&c.pend>0.005){ const dd=Math.round((c.due-TODAY)/864e5); dias=dd>=0?dd+' días':Math.abs(dd)+' días vencido'; }
  document.getElementById('mInfo').innerHTML=
    `<span class="k">Línea</span><span class="v" style="color:${isExt(r)?'var(--morado)':'var(--orange)'}">${isExt(r)?'Extraordinaria':'Regular'}</span>`+
    `<span class="k">Estado</span><span class="v">${c.overdue?'Vencido':ESTADO[r.estado]}</span>`+
    `<span class="k">Monto</span><span class="v">${money2(r.monto)}</span>`+
    (r.fInv?`<span class="k">Facturada</span><span class="v">${r.fInv}</span>`:'')+
    (c.due?`<span class="k">Vence (60d)</span><span class="v">${c.due.toLocaleDateString('es-PA')}</span>`:'')+
    `<span class="k">Saldo pendiente</span><span class="v" style="color:${c.pend>0.005?(c.overdue?'var(--rojoosc)':'var(--rojo)'):'var(--verde)'}">${money2(c.pend)}</span>`+
    `<span class="k">Días</span><span class="v">${dias}</span>`+
    `<span class="k">Pagado</span><span class="v">${money2(c.pag)}</span>`+
    (r.pagoUrl?`<span class="k">Constancia</span><span class="v"><a href="#" style="color:var(--azul)">Ver pago 🔗</a></span>`:'');
  document.getElementById('modal').classList.add('show');
}
function closeM(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').onclick=e=>{ if(e.target.id==='modal') closeM(); };
document.getElementById('filters').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; FILTER=b.dataset.l;
  [...document.querySelectorAll('.fbtn')].forEach(x=>{ x.classList.toggle('on',x===b); }); list(); };
lineCards(); list();
</script>
</body>
</html>
