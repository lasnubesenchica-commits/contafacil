<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#D04E00">
<title>BalanceClip — Conversaciones del bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F8F9FA; --surface:#FFFFFF; --surface2:#F1F3F5;
    --border:#DEE2E6; --border2:#CED4DA;
    --orange:#D04E00; --orange2:#E8620A;
    --green:#2E7D32; --blue:#1565C0; --red:#C62828;
    --text:#1A1A2E; --muted:#6C757D;
    --bubble-out:#DCF8C6; --bubble-in:#FFFFFF;
    --mono:'DM Mono',monospace; --sans:'Sora',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }

  .topbar {
    position:sticky; top:0; z-index:50;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; gap:12px;
  }
  .topbar-back {
    background:none; border:none; cursor:pointer; font-size:22px;
    color:var(--muted); padding:0 4px;
  }
  .topbar-title {
    font-family:'Sora',sans-serif; font-size:14px; letter-spacing:.5px;
    color:var(--text); font-weight:600;
  }
  .topbar-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .topbar-actions { margin-left:auto; display:flex; gap:8px; }
  .btn-ic {
    background:transparent; border:1px solid var(--border); color:var(--muted);
    width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:14px;
  }
  .btn-ic:hover { color:var(--orange); border-color:var(--orange); }

  .container { max-width:780px; margin:0 auto; padding:18px 16px 80px; }

  .hero {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px 20px; margin-bottom:16px;
  }
  .hero-title {
    font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px;
  }
  .hero-desc { font-size:12px; color:var(--muted); margin-top:6px; }
  .hero-stats {
    display:flex; gap:14px; margin-top:10px; font-size:12px; color:var(--muted);
    flex-wrap:wrap;
  }
  .hero-stats b { color:var(--text); font-weight:700; }

  .controls {
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  }
  .search-wrap {
    flex:1; min-width:200px; position:relative;
  }
  .search-wrap input {
    width:100%; padding:9px 12px 9px 36px; font-size:13px;
    border:1px solid var(--border2); background:var(--surface); color:var(--text);
    border-radius:8px; font-family:inherit; outline:none;
  }
  .search-wrap input:focus { border-color:var(--orange); }
  .search-wrap::before {
    content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%);
    font-size:12px; color:var(--muted); pointer-events:none;
  }
  .status-sel {
    padding:9px 12px; font-size:13px; border:1px solid var(--border2);
    background:var(--surface); color:var(--text); border-radius:8px;
    font-family:inherit; cursor:pointer;
  }

  .lead-list {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    overflow:hidden;
  }
  .lead {
    padding:14px 18px; border-bottom:1px solid var(--border);
    display:grid; grid-template-columns:1fr auto; gap:6px 12px;
    cursor:pointer; transition:background .12s;
  }
  .lead:last-child { border-bottom:none; }
  .lead:hover { background:var(--surface2); }
  .lead-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .lead-name {
    font-weight:700; font-size:14px; color:var(--text);
  }
  .lead-phone {
    font-family:var(--mono); font-size:12px; color:var(--muted);
  }
  .lead-time {
    font-size:11px; color:var(--muted); text-align:right; white-space:nowrap;
  }
  .lead-preview {
    grid-column:1 / -1;
    font-size:12px; color:var(--muted); line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; max-height:34px;
  }
  .lead-preview-icon { color:var(--muted); margin-right:4px; }

  .badge {
    display:inline-flex; align-items:center; padding:2px 8px;
    border-radius:10px; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .badge.nuevo     { background:#E3F2FD; color:var(--blue); }
  .badge.signup    { background:#FFF3E0; color:#E65100; }
  .badge.setup     { background:#F3E5F5; color:#6A1B9A; }
  .badge.aprobando { background:#FFF8E1; color:#F57F17; }
  .badge.activo    { background:#E8F5E9; color:var(--green); }

  .empty {
    text-align:center; padding:44px 20px; color:var(--muted); font-size:13px;
    background:var(--surface); border:1px dashed var(--border); border-radius:12px;
  }
  .loading { padding:30px; text-align:center; color:var(--muted); font-size:13px; }

  /* ────────── Thread view ────────── */
  .thread-overlay {
    position:fixed; inset:0; background:var(--bg);
    display:none; flex-direction:column; z-index:60;
  }
  .thread-overlay.active { display:flex; }
  .thread-topbar {
    border-bottom:1px solid var(--border); background:var(--surface);
    padding:14px 18px; display:flex; align-items:center; gap:12px;
  }
  .thread-info { flex:1; min-width:0; }
  .thread-info .name { font-weight:700; font-size:15px; }
  .thread-info .phone {
    font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px;
  }
  .thread-body {
    flex:1; overflow-y:auto; padding:18px 14px 32px;
    background:#ECE5DD; /* WhatsApp-ish backdrop */
  }
  .bubble {
    max-width:78%; padding:8px 12px 10px; border-radius:10px; margin-bottom:6px;
    font-size:13px; line-height:1.42; white-space:pre-wrap; word-wrap:break-word;
    box-shadow:0 1px 1px rgba(0,0,0,0.06);
  }
  .bubble.in  { background:var(--bubble-in); margin-right:auto; border-bottom-left-radius:2px; }
  .bubble.out { background:var(--bubble-out); margin-left:auto;  border-bottom-right-radius:2px; }
  .bubble-meta {
    font-size:10px; color:var(--muted); margin-top:4px; display:flex; gap:6px;
  }
  .bubble-meta .accion {
    font-family:var(--mono); background:rgba(0,0,0,0.05); padding:1px 5px; border-radius:3px;
  }
  .bubble.system {
    background:rgba(255,255,255,0.7); color:var(--muted); font-size:11px;
    text-align:center; max-width:60%; margin:14px auto;
    border-radius:6px; padding:5px 10px; box-shadow:none;
  }
  .day-sep {
    text-align:center; font-size:11px; color:var(--muted);
    background:rgba(255,255,255,0.75); padding:4px 10px;
    border-radius:6px; margin:14px auto; width:fit-content;
  }
  .err-banner {
    background:#FFEBEE; color:var(--red); padding:12px 16px;
    border:1px solid #FFCDD2; border-radius:8px; margin-bottom:14px;
    font-size:13px;
  }

  @media (max-width:600px) {
    .container { padding:14px 12px 60px; }
    .hero { padding:14px 16px 16px; }
    .topbar { padding:12px 14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="./" class="topbar-back" style="text-decoration:none">←</a>
  <div>
    <div class="topbar-title">Admin · Conversaciones bot</div>
    <div class="topbar-sub" id="topbarSub">—</div>
  </div>
  <div class="topbar-actions">
    <button class="btn-ic" onclick="loadList(true)" title="Refrescar">↻</button>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="hero-title">💬 Conversaciones del bot</div>
    <div class="hero-desc">Leads que interactuaron con el bot de WhatsApp de BalanceClip (signup, setup, soporte).</div>
    <div class="hero-stats" id="heroStats">—</div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input type="search" id="qInput" placeholder="Buscar nombre o teléfono…" oninput="onSearch()">
    </div>
    <select class="status-sel" id="statusSel" onchange="onStatus()">
      <option value="all">Todos los estados</option>
      <option value="nuevo">🆕 Nuevo</option>
      <option value="signup">📝 En signup</option>
      <option value="setup">⚙️ En setup</option>
      <option value="aprobando">⏳ Aprobando facturas</option>
      <option value="activo">✅ Activo</option>
    </select>
  </div>

  <div id="leadList" class="lead-list">
    <div class="loading">⏳ Cargando…</div>
  </div>
</div>

<!-- Thread overlay -->
<div class="thread-overlay" id="threadOverlay">
  <div class="thread-topbar">
    <button class="topbar-back" onclick="closeThread()">←</button>
    <div class="thread-info">
      <div class="name" id="threadName">—</div>
      <div class="phone" id="threadPhone">—</div>
    </div>
    <button class="btn-ic" onclick="reloadThread()" title="Refrescar">↻</button>
  </div>
  <div class="thread-body" id="threadBody"><div class="loading">⏳ Cargando…</div></div>
</div>

<script>
const ROUTER_URL = 'https://script.google.com/macros/s/AKfycbzzgc0zIe4cQ52jZciIMy6IYfiHNeQsgql5Mz_tPIabSLk4CVMfg8cImlukumGr906orw/exec';

let _items = [];
let _q = '';
let _status = 'all';
let _currentPhone = null;

function getToken() { return localStorage.getItem('bc_admin_token') || ''; }

// JSONP helper
let _jsonpSeq = 0;
function jsonpGet(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = '_bc_cb_' + (++_jsonpSeq) + '_' + Date.now();
    const qs = Object.keys(params).map(k => encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    const url = ROUTER_URL + '?' + qs + '&callback=' + cbName;
    const s = document.createElement('script');
    let done = false;
    const cleanup = () => {
      delete window[cbName];
      if (s.parentNode) s.parentNode.removeChild(s);
    };
    window[cbName] = (data) => { done = true; cleanup(); resolve(data); };
    s.onerror = () => { if (done) return; cleanup(); reject(new Error('jsonp network error')); };
    setTimeout(() => { if (done) return; cleanup(); reject(new Error('jsonp timeout')); }, timeoutMs || 20000);
    s.src = url;
    document.head.appendChild(s);
  });
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(ms) {
  if (!ms) return '—';
  const diff = Date.now() - ms;
  const min = Math.floor(diff / 60000);
  if (min < 1)      return 'recién';
  if (min < 60)    return min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24)      return 'hace ' + h + ' h';
  const d = Math.floor(h / 24);
  if (d < 30)      return 'hace ' + d + ' d';
  const mo = Math.floor(d / 30);
  return 'hace ' + mo + ' mes' + (mo===1?'':'es');
}

function fmtPhone(p) {
  // Format Panama numbers nicely: +507 6981 2266
  const s = String(p || '');
  if (s.length === 11 && s.startsWith('507')) {
    return '+507 ' + s.substring(3,7) + ' ' + s.substring(7);
  }
  if (s.length === 8) return '+507 ' + s.substring(0,4) + ' ' + s.substring(4);
  return '+' + s;
}

function statusLabel(s) {
  switch(s) {
    case 'nuevo':     return 'NUEVO';
    case 'signup':    return 'SIGNUP';
    case 'setup':     return 'SETUP';
    case 'aprobando': return 'APROBANDO';
    case 'activo':    return 'ACTIVO';
    default:          return '—';
  }
}

function previewText(c) {
  const prefix = c.lastDir === 'out' ? '↩ ' : '';
  const tipo = (c.lastTipo || '').toLowerCase();
  let msg = c.lastMsg || '';
  if (tipo === 'image')       msg = '📷 [imagen]' + (msg ? ' ' + msg : '');
  else if (tipo === 'document') msg = '📄 [documento]';
  else if (tipo === 'audio')    msg = '🎤 [audio]';
  return '<span class="lead-preview-icon">' + prefix + '</span>' + esc(msg);
}

async function loadList(forceFresh) {
  const t = getToken();
  if (!t) {
    document.getElementById('leadList').innerHTML =
      '<div class="empty">🔒 Falta el <code>ADMIN_TOKEN</code>. <a href="./">Configuralo en el hub</a>.</div>';
    document.getElementById('topbarSub').textContent = 'sin token';
    return;
  }
  if (forceFresh) {
    document.getElementById('leadList').innerHTML = '<div class="loading">⏳ Cargando…</div>';
  }
  try {
    const data = await jsonpGet({ action:'getConversations', adminToken:t, limit:500 });
    if (!data || !data.ok) {
      document.getElementById('leadList').innerHTML =
        '<div class="err-banner">⚠️ ' + esc((data && data.error) || 'error desconocido') + '</div>';
      return;
    }
    _items = data.items || [];
    document.getElementById('topbarSub').textContent =
      (data.total || 0) + ' leads · ' + (data.totalMsgs || 0) + ' mensajes';
    renderHeroStats(_items, data.totalMsgs);
    renderList();
  } catch (e) {
    document.getElementById('leadList').innerHTML =
      '<div class="err-banner">⚠️ No se pudo contactar al router: ' + esc(e.message) + '</div>';
  }
}

function renderHeroStats(items, totalMsgs) {
  const by = { activo:0, signup:0, setup:0, aprobando:0, nuevo:0 };
  items.forEach(c => { if (by[c.signupStatus] != null) by[c.signupStatus]++; });
  document.getElementById('heroStats').innerHTML =
    '<span><b>' + items.length + '</b> leads</span> ' +
    '<span>·</span> ' +
    '<span><b>' + by.signup + '</b> en signup</span> ' +
    '<span>·</span> ' +
    '<span><b>' + by.setup + '</b> en setup</span> ' +
    '<span>·</span> ' +
    '<span><b>' + by.activo + '</b> activos</span> ' +
    '<span>·</span> ' +
    '<span><b>' + (totalMsgs || 0) + '</b> mensajes</span>';
}

function renderList() {
  const list = document.getElementById('leadList');
  const q = _q.toLowerCase();
  let arr = _items;
  if (q) {
    arr = arr.filter(c =>
      c.phone.indexOf(q) >= 0 ||
      (c.lastMsg && c.lastMsg.toLowerCase().indexOf(q) >= 0)
    );
  }
  if (_status !== 'all') arr = arr.filter(c => c.signupStatus === _status);
  if (!arr.length) {
    list.innerHTML = '<div class="empty">Sin conversaciones para los filtros aplicados.</div>';
    return;
  }
  list.innerHTML = arr.map(c => `
    <div class="lead" onclick="openThread('${esc(c.phone)}')">
      <div class="lead-head">
        ${c.signupStatus ? `<span class="badge ${esc(c.signupStatus)}">${statusLabel(c.signupStatus)}</span>` : ''}
        <span class="lead-name">${esc(fmtPhone(c.phone))}</span>
        <span class="lead-phone">·  ${c.msgCount} msg${c.msgCount===1?'':'s'}</span>
      </div>
      <div class="lead-time">${timeAgo(c.lastTime)}</div>
      <div class="lead-preview">${previewText(c)}</div>
    </div>
  `).join('');
}

function onSearch() {
  _q = document.getElementById('qInput').value.trim();
  renderList();
}
function onStatus() {
  _status = document.getElementById('statusSel').value;
  renderList();
}

async function openThread(phone) {
  _currentPhone = phone;
  document.getElementById('threadName').textContent = fmtPhone(phone);
  document.getElementById('threadPhone').textContent = '+' + phone;
  document.getElementById('threadBody').innerHTML = '<div class="loading">⏳ Cargando thread…</div>';
  document.getElementById('threadOverlay').classList.add('active');
  await loadThread();
}

function closeThread() {
  document.getElementById('threadOverlay').classList.remove('active');
  _currentPhone = null;
}

async function reloadThread() {
  if (!_currentPhone) return;
  document.getElementById('threadBody').innerHTML = '<div class="loading">⏳ Recargando…</div>';
  await loadThread();
}

async function loadThread() {
  const t = getToken();
  try {
    const data = await jsonpGet({ action:'getConversation', adminToken:t, phone:_currentPhone });
    if (!data || !data.ok) {
      document.getElementById('threadBody').innerHTML =
        '<div class="err-banner">⚠️ ' + esc((data && data.error) || 'error') + '</div>';
      return;
    }
    renderThread(data.items || []);
  } catch (e) {
    document.getElementById('threadBody').innerHTML =
      '<div class="err-banner">⚠️ ' + esc(e.message) + '</div>';
  }
}

function renderThread(items) {
  if (!items.length) {
    document.getElementById('threadBody').innerHTML =
      '<div class="empty">Sin mensajes registrados.</div>';
    return;
  }
  let html = '';
  let lastDay = '';
  items.forEach(m => {
    const d = new Date(m.time);
    const dayKey = d.toISOString().substring(0,10);
    if (dayKey !== lastDay) {
      lastDay = dayKey;
      html += '<div class="day-sep">' + esc(fmtDay(d)) + '</div>';
    }
    const sideCls = m.dir === 'out' ? 'out' : 'in';
    const hhmm = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    let body = esc(m.contenido || '');
    // Light styling: WhatsApp uses *bold* and _italic_; we render *bold* as <b>
    body = body.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
    const accion = m.accion ? `<span class="accion">${esc(m.accion)}</span>` : '';
    html += `
      <div class="bubble ${sideCls}">
        ${body || '<i style="color:var(--muted)">(vacío)</i>'}
        <div class="bubble-meta"><span>${hhmm}</span>${accion}<span style="opacity:.7">${esc(m.tipo)}</span></div>
      </div>`;
  });
  const body = document.getElementById('threadBody');
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fmtDay(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const that  = new Date(d); that.setHours(0,0,0,0);
  const diff = Math.round((today - that) / 86400000);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Ayer';
  if (diff > 1 && diff < 7) return MESES[d.getMonth()] + ' ' + d.getDate() + ' · hace ' + diff + ' días';
  return MESES[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _currentPhone) closeThread();
});

loadList(true);
</script>

</body>
</html>
