<script>
(function() {

const GAS_URL = (typeof window.GAS_URL !== 'undefined' && window.GAS_URL)
             || 'https://script.google.com/macros/s/AKfycbxr_kHelzOpNySgC04fsVlDhed4VPeOXVSICIFcOk_4r3NR0D5QQQgnq6mc9ZRMuSRiUA/exec';

const EMPRESA = {
  nombre: 'Consultores Electrotécnicos y Contratistas S.A.',
  ruc:    '2470636-1-814806',
  dv:     '—',
  form:   'Persona Jurídica General',
};

const MESES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio',
               'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let ca_ing = [], ca_egr = [], ca_sts = [];
let ca_year = new Date().getFullYear() - 1; // default: año anterior (ya cerrado)

// ── JSONP ─────────────────────────────────────────
function caJsonp(action) {
  return new Promise((resolve, reject) => {
    const cb = 'caCb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    let done = false;
    const t = setTimeout(() => { if (!done) { done=true; cleanup(); reject(new Error('Timeout: '+action)); } }, 30000);
    window[cb] = d => { if (!done) { done=true; clearTimeout(t); cleanup(); resolve(d); } };
    s.onerror = () => { if (!done) { done=true; clearTimeout(t); cleanup(); reject(new Error('Error red')); } };
    s.src = GAS_URL + '?action=' + action + '&callback=' + cb;
    function cleanup() { delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    document.head.appendChild(s);
  });
}

// ── LOAD ─────────────────────────────────────────
async function caLoad() {
  try {
    const [ingRes, egrRes, stRes] = await Promise.all([
      (typeof ingItems !== 'undefined' && ingItems.length)
        ? Promise.resolve({ success: true, items: ingItems })
        : caJsonp('getIngresos'),
      (typeof egrItems !== 'undefined' && egrItems.length)
        ? Promise.resolve({ success: true, items: egrItems })
        : caJsonp('getEgresos'),
      caJsonp('getCotizaciones'),
    ]);

    ca_ing = (ingRes.items || []).filter(i => {
      const e = String(i.estado||'').toLowerCase();
      return e === 'confirmado' || e === 'abono' || e === 'pendiente';
    });
    ca_egr = egrRes.items || [];
    ca_sts = (stRes.items || []).filter(st => st.estado !== 'cancelado');

    caPopulateYears();
    caApply();
  } catch(err) {
    document.getElementById('caPage').innerHTML =
      `<div style="padding:3rem;text-align:center;color:#C62828">
        <div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>
        <div>${caEsc(err.message)}</div>
        <button onclick="caLoad()" style="margin-top:1rem;padding:.5rem 1.25rem;background:#E65100;color:#fff;border:none;border-radius:7px;cursor:pointer">Reintentar</button>
      </div>`;
  }
}

function caPopulateYears() {
  const years = new Set();
  ca_ing.forEach(i => { if (i.anio_fiscal) years.add(Number(i.anio_fiscal)); });
  ca_egr.forEach(e => { const y = Number(e.anio||e.anio_fiscal); if (y) years.add(y); });
  if (!years.size) years.add(new Date().getFullYear());
  const sel = document.getElementById('caSelAnio');
  sel.innerHTML = [...years].sort((a,b)=>b-a)
    .map(y => `<option value="${y}" ${y===ca_year?'selected':''}>${y}</option>`).join('');
  ca_year = Number(sel.value);
}

function caApply() {
  ca_year = Number(document.getElementById('caSelAnio').value);
  caRender();
}
window.caApply = caApply;

// ── CÁLCULOS ──────────────────────────────────────
function caCalc() {
  const y = ca_year;
  const ing = ca_ing.filter(i => Number(i.anio_fiscal) === y);
  const egr = ca_egr.filter(e => Number(e.anio||e.anio_fiscal) === y);
  const sts = ca_sts.filter(st => {
    return Number(st.anio||0) === y || Number(st.anio_ingreso||0) === y;
  });

  // ── Ingresos ──────────────────────────────────
  const ingGravados = ing.filter(i => !String(i.categoria_ingreso||'').includes('exento'));
  const ingExentos  = ing.filter(i =>  String(i.categoria_ingreso||'').includes('exento'));

  const totalIngBruto   = ing.reduce((s,i) => s+Number(i.subtotal||0), 0);
  const totalIngGravado = ingGravados.reduce((s,i) => s+Number(i.subtotal||0), 0);
  const totalIngExento  = ingExentos.reduce((s,i) => s+Number(i.subtotal||0), 0);
  const totalITBMSCobrado = ing.reduce((s,i) => s+Number(i.itbms||0), 0);

  // Breakdown por categoría
  const ingPorCat = {};
  ing.forEach(i => {
    const k = i.tipo_ingreso || i.categoria_ingreso || 'otro';
    if (!ingPorCat[k]) ingPorCat[k] = { subtotal: 0, itbms: 0, total: 0, n: 0 };
    ingPorCat[k].subtotal += Number(i.subtotal||0);
    ingPorCat[k].itbms    += Number(i.itbms||0);
    ingPorCat[k].total    += Number(i.total||0);
    ingPorCat[k].n++;
  });

  // ── Egresos ───────────────────────────────────
  const egrNormal  = egr.filter(e => e.tipo_egreso !== 'credito_fiscal');
  const egrCredito = egr.filter(e => e.tipo_egreso === 'credito_fiscal');

  const totalEgr       = egrNormal.reduce((s,e) => s+Number(e.total||0), 0);
  const totalITBMSPag  = egrNormal.reduce((s,e) => s+Number(e.itbms||0), 0);
  const totalCredFisc  = egrCredito.reduce((s,e) => s+Number(e.total||0), 0);
  const itbmsNeto      = totalITBMSCobrado - totalITBMSPag - totalCredFisc;

  // Breakdown por tipo de egreso
  const egrPorTipo = {};
  egrNormal.forEach(e => {
    const k = e.tipo_egreso || 'otros_deducibles';
    if (!egrPorTipo[k]) egrPorTipo[k] = { total: 0, itbms: 0, n: 0 };
    egrPorTipo[k].total += Number(e.total||0);
    egrPorTipo[k].itbms += Number(e.itbms||0);
    egrPorTipo[k].n++;
  });

  // Costo de ventas = costo_mercancia + costo_servicio_tecnico + impuesto_importacion
  const COSTO_KEYS = ['costo_mercancia','costo_servicio_tecnico','impuesto_importacion'];
  const totalCostoVentas = COSTO_KEYS.reduce((s,k) => s + (egrPorTipo[k]?.total||0), 0);

  // Gastos deducibles = todo lo que no es costo de ventas ni credito_fiscal
  const totalGastosDeducibles = totalEgr - totalCostoVentas;

  // Renta neta = ingresos gravados - costo ventas - gastos deducibles
  const rentaNeta = totalIngGravado - totalCostoVentas - totalGastosDeducibles;
  const isrTrad   = rentaNeta > 0 ? rentaNeta * 0.25 : 0; // ISR 25% método tradicional

  // ── ITBMS mensual ─────────────────────────────
  const itbmsPorMes = Array.from({length:12}, (_,i) => {
    const m = i + 1;
    const ingM = ing.filter(x => Number(x.mes) === m);
    const egrM = egr.filter(x => Number(x.mes) === m);
    const cobrado = ingM.reduce((s,x) => s+Number(x.itbms||0), 0);
    const pagado  = egrM.filter(x=>x.tipo_egreso!=='credito_fiscal').reduce((s,x)=>s+Number(x.itbms||0),0);
    const credito = egrM.filter(x=>x.tipo_egreso==='credito_fiscal').reduce((s,x)=>s+Number(x.total||0),0);
    return { m, cobrado, pagado, credito, neto: cobrado-pagado-credito };
  });

  // ── Egresos por mes ───────────────────────────
  const egrPorMes = Array.from({length:12}, (_,i) => {
    const m = i + 1;
    const egrM = egrNormal.filter(e => Number(e.mes) === m);
    const costoM   = egrM.filter(e=>COSTO_KEYS.includes(e.tipo_egreso)).reduce((s,e)=>s+Number(e.total||0),0);
    const gastosM  = egrM.filter(e=>!COSTO_KEYS.includes(e.tipo_egreso)).reduce((s,e)=>s+Number(e.total||0),0);
    const ingM     = ing.filter(x => Number(x.mes) === m).reduce((s,x)=>s+Number(x.subtotal||0),0);
    return { m, costoM, gastosM, totalM: costoM+gastosM, ingM };
  }).filter(r => r.totalM > 0 || r.ingM > 0);

  // ── CxC al cierre ─────────────────────────────
  const opPendCobro = (typeof opItems !== 'undefined' ? opItems : [])
    .filter(i => i.estado === 'facturado');
  const stPendCobro = ca_sts.filter(st => {
    if (st.estado !== 'cerrado' || !st.ingreso_id) return false;
    const ingR = ca_ing.find(i => i.id_trans === st.ingreso_id);
    return ingR && String(ingR.estado||'').toLowerCase() === 'pendiente';
  });
  const stEnEjec = ca_sts.filter(st => st.estado === 'en_ejecucion');

  const totalCxCOp = opPendCobro.reduce((s,i) => s+parseFloat(i.total_venta||0), 0);
  const totalCxCST = stPendCobro.reduce((s,st) => {
    const ingR = ca_ing.find(i => i.id_trans === st.ingreso_id);
    return s + parseFloat(st.subtotal_venta || ingR?.total || 0);
  }, 0);
  const totalEnEjec = stEnEjec.reduce((s,st) => s+parseFloat(st.precio_venta||0), 0);

  return {
    ing, egr, sts,
    totalIngBruto, totalIngGravado, totalIngExento, totalITBMSCobrado,
    ingPorCat,
    totalEgr, totalCostoVentas, totalGastosDeducibles, egrPorTipo,
    totalITBMSPag, totalCredFisc, itbmsNeto,
    rentaNeta, isrTrad,
    itbmsPorMes, egrPorMes,
    opPendCobro, stPendCobro, stEnEjec,
    totalCxCOp, totalCxCST, totalEnEjec,
    egrNormal, egrCredito,
  };
}
