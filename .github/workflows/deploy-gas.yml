name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'backend-gas/**'
      - 'BalanceClip/**'
      - 'clients.json'

jobs:
  deploy:
    name: Deploy GAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Deploy a Google Apps Script
        run: node scripts/deploy-gas.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
