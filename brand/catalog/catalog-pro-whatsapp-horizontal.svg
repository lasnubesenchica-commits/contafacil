<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!-- BalanceClip Pro · Horizontal 1.91:1 para Feed y Banners -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="sparkColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="628" fill="url(#bgGrad)"/>

  <!-- COLUMNA IZQUIERDA: logo + título + badge -->
  <g transform="translate(60 60)">
    <!-- Header -->
    <circle cx="26" cy="26" r="26" fill="url(#orangeGrad)"/>
    <g transform="translate(26 26) rotate(-12) translate(-10 -18)">
      <path d="M 7 3.5 C 7 1.5, 8.5 0, 10.5 0 C 12.5 0, 14 1.5, 14 3.5 L 14 31.5 C 14 34.4, 11.6 36.7, 8.75 36.7 C 5.9 36.7, 3.5 34.4, 3.5 31.5 L 3.5 7 C 3.5 5.5, 4.8 4.2, 6.3 4.2 C 7.8 4.2, 9.1 5.5, 9.1 7 L 9.1 30.3 C 9.1 31.1, 9.8 31.8, 10.6 31.8 C 11.4 31.8, 12.1 31.1, 12.1 30.3 L 12.1 5.8"
            fill="none" stroke="#ffffff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="68" y="24" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1f2937">Balance<tspan fill="#ea580c">Clip</tspan></text>
    <text x="68" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="2">PRO · TRACK 01</text>
  </g>

  <!-- Título grande -->
  <text x="60" y="220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#111827">Captura por</text>
  <text x="60" y="280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#128C7E">WhatsApp</text>

  <!-- Subtítulo -->
  <text x="60" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#374151">Foto al recibo → la IA lee → todo guardado</text>

  <!-- Badge 7 días gratis -->
  <g transform="translate(60 410)">
    <rect x="0" y="0" width="280" height="64" rx="32" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
    <text x="140" y="42" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">7 DÍAS GRATIS</text>
  </g>

  <!-- Subtexto -->
  <text x="60" y="510" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#6b7280">DGI Panamá · ITBMS · Categoría automática</text>

  <!-- COLUMNA DERECHA: flujo visual horizontal grande -->
  <g transform="translate(650 180)">
    <!-- Paso 1: Foto -->
    <g transform="translate(0 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="140" height="140" rx="28" fill="#ffffff"/>
      <rect x="40" y="30" width="60" height="80" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
      <line x1="48" y1="46" x2="92" y2="46" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="58" x2="82" y2="58" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="70" x2="88" y2="70" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="86" x2="92" y2="86" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <line x1="48" y1="98" x2="72" y2="98" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="165" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="middle">Foto</text>
    </g>

    <text x="170" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="44" fill="#fb923c" text-anchor="middle">→</text>

    <!-- Paso 2: WhatsApp -->
    <g transform="translate(200 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#waGreen)"/>
      <path d="M 36 42 L 104 42 Q 114 42, 114 52 L 114 84 Q 114 94, 104 94 L 64 94 L 50 110 L 50 94 L 36 94 Q 26 94, 26 84 L 26 52 Q 26 42, 36 42 Z" fill="#ffffff"/>
      <circle cx="50" cy="68" r="4" fill="#25D366"/>
      <circle cx="70" cy="68" r="4" fill="#25D366"/>
      <circle cx="90" cy="68" r="4" fill="#25D366"/>
      <text x="70" y="165" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="middle">WhatsApp</text>
    </g>

    <text x="370" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="44" fill="#fb923c" text-anchor="middle">→</text>

    <!-- Paso 3: Listo -->
    <g transform="translate(400 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="140" height="140" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="44" fill="#10b981"/>
      <path d="M 50 70 L 64 84 L 92 56" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(112 32)" filter="url(#sparkGlow)">
        <path d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z" fill="url(#sparkColor)"/>
      </g>
      <text x="70" y="165" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="middle">Listo</text>
    </g>
  </g>
</svg>
