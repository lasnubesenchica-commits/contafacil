<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- BalanceClip Pro catalog card: 500x500, square, optimized for Meta WhatsApp catalog -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="sparkColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo suave anaranjado -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- HEADER: BalanceClip logo + nombre -->
  <g transform="translate(40 40)">
    <!-- Mini paperclip avatar (círculo naranja) -->
    <circle cx="22" cy="22" r="22" fill="url(#orangeGrad)"/>
    <g transform="translate(22 22) rotate(-12) translate(-9 -16)">
      <path d="M 6 3 C 6 1.3, 7.3 0, 9 0 C 10.7 0, 12 1.3, 12 3 L 12 27 C 12 29.5, 10 31.5, 7.5 31.5 C 5 31.5, 3 29.5, 3 27 L 3 6 C 3 4.7, 4.1 3.6, 5.4 3.6 C 6.7 3.6, 7.8 4.7, 7.8 6 L 7.8 26 C 7.8 26.7, 8.4 27.3, 9.1 27.3 C 9.8 27.3, 10.4 26.7, 10.4 26 L 10.4 5"
            fill="none" stroke="#ffffff" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="58" y="20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f2937">Balance</text>
    <text x="148" y="20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ea580c">Clip</text>
    <text x="58" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1.5">PRO · TRACK 01</text>
  </g>

  <!-- TÍTULO grande -->
  <text x="250" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827" text-anchor="middle">Captura por</text>
  <text x="250" y="156" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#128C7E" text-anchor="middle">WhatsApp</text>

  <!-- FLUJO: 3 pasos visuales con flechas -->
  <g transform="translate(0 200)">
    <!-- Paso 1: 📷 cámara con recibo -->
    <g transform="translate(70 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="100" height="100" rx="20" fill="#ffffff"/>
      <!-- icono cámara/recibo -->
      <rect x="28" y="22" width="44" height="58" rx="3" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
      <line x1="34" y1="34" x2="66" y2="34" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
      <line x1="34" y1="42" x2="58" y2="42" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
      <line x1="34" y1="50" x2="62" y2="50" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
      <line x1="34" y1="62" x2="66" y2="62" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="34" y1="70" x2="50" y2="70" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
      <text x="50" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Foto</text>
    </g>

    <!-- Flecha 1 -->
    <text x="195" y="55" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#fb923c" text-anchor="middle">→</text>

    <!-- Paso 2: 💬 burbuja WhatsApp -->
    <g transform="translate(220 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#waGreen)"/>
      <!-- burbuja chat -->
      <path d="M 25 30 L 75 30 Q 82 30 82 37 L 82 60 Q 82 67 75 67 L 45 67 L 35 78 L 35 67 L 25 67 Q 18 67 18 60 L 18 37 Q 18 30 25 30 Z" fill="#ffffff"/>
      <circle cx="35" cy="48" r="3" fill="#25D366"/>
      <circle cx="50" cy="48" r="3" fill="#25D366"/>
      <circle cx="65" cy="48" r="3" fill="#25D366"/>
      <text x="50" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">WhatsApp</text>
    </g>

    <!-- Flecha 2 -->
    <text x="345" y="55" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#fb923c" text-anchor="middle">→</text>

    <!-- Paso 3: ✅ check con sparkle IA -->
    <g transform="translate(370 0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="100" height="100" rx="20" fill="#ffffff"/>
      <!-- Check verde -->
      <circle cx="50" cy="50" r="32" fill="#10b981"/>
      <path d="M 35 50 L 46 61 L 66 41" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- spark IA -->
      <g transform="translate(82 22)" filter="url(#sparkGlow)">
        <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z" fill="url(#sparkColor)"/>
      </g>
      <text x="50" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Listo</text>
    </g>
  </g>

  <!-- BADGE inferior: 7 días gratis -->
  <g transform="translate(250 410)">
    <rect x="-130" y="0" width="260" height="50" rx="25" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
    <text x="0" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">7 DÍAS GRATIS</text>
  </g>

  <!-- Sub-texto sutil debajo -->
  <text x="250" y="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="middle">DGI Panamá · ITBMS · Categoría automática</text>
</svg>
