<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- v1: Paperclip refinado sobre gradiente naranja con brillo radial -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="clipShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular completo (WhatsApp lo recorta a círculo igual) -->
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- Paperclip geométrico, centrado, ligero giro -3° para movimiento -->
  <g transform="translate(320 320) rotate(-12) translate(-90 -180)" filter="url(#innerShadow)">
    <!-- Path de un paperclip pulido -->
    <path d="M 60 30
             C 60 13, 73 0, 90 0
             C 107 0, 120 13, 120 30
             L 120 280
             C 120 305, 100 325, 75 325
             C 50 325, 30 305, 30 280
             L 30 60
             C 30 47, 41 36, 54 36
             C 67 36, 78 47, 78 60
             L 78 270
             C 78 277, 84 283, 91 283
             C 98 283, 104 277, 104 270
             L 104 50"
          fill="none"
          stroke="url(#clipShade)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Pequeño destello arriba a la izquierda para profundidad -->
  <circle cx="180" cy="170" r="80" fill="#fff" opacity="0.08"/>
</svg>
