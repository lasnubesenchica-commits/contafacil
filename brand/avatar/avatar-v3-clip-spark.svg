<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- v3: Paperclip + spark IA · variante con énfasis "asistente fiscal" -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="sparkColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg3)"/>

  <!-- Paperclip principal, recto, blanco -->
  <g transform="translate(320 320) rotate(0) translate(-75 -180)">
    <path d="M 50 30
             C 50 13, 63 0, 80 0
             C 97 0, 110 13, 110 30
             L 110 280
             C 110 305, 90 325, 65 325
             C 40 325, 20 305, 20 280
             L 20 60
             C 20 47, 31 36, 44 36
             C 57 36, 68 47, 68 60
             L 68 270
             C 68 277, 74 283, 81 283
             C 88 283, 94 277, 94 270
             L 94 50"
          fill="none"
          stroke="#fff"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- ✨ Spark de IA arriba a la derecha (4 puntas estrella) -->
  <g transform="translate(465 175)">
    <path d="M 0 -32 L 7 -7 L 32 0 L 7 7 L 0 32 L -7 7 L -32 0 L -7 -7 Z"
          fill="url(#sparkColor)"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
  </g>
  <g transform="translate(490 250) scale(0.55)">
    <path d="M 0 -32 L 7 -7 L 32 0 L 7 7 L 0 32 L -7 7 L -32 0 L -7 -7 Z"
          fill="url(#sparkColor)" opacity="0.85"/>
  </g>
</svg>
