<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- v1+IA: paperclip refinado v1 + sparkles de IA estilo v3
       Mantiene el gradient radial, sombra interna y rotación -12° del v1.
       Agrega 3 sparks dorados de tamaños distintos para indicar el
       componente "asistente IA" sin saturar. -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="clipShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="sparkColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- Brillo radial sutil arriba a la izq (idéntico a v1) -->
  <circle cx="180" cy="170" r="80" fill="#fff" opacity="0.08"/>

  <!-- Paperclip (idéntico al v1: misma rotación, mismo trazo) -->
  <g transform="translate(320 320) rotate(-12) translate(-90 -180)" filter="url(#innerShadow)">
    <path d="M 60 30
             C 60 13, 73 0, 90 0
             C 107 0, 120 13, 120 30
             L 120 280
             C 120 305, 100 325, 75 325
             C 50 325, 30 305, 30 280
             L 30 60
             C 30 47, 41 36, 54 36
             C 67 36, 78 47, 78 60
             L 78 270
             C 78 277, 84 283, 91 283
             C 98 283, 104 277, 104 270
             L 104 50"
          fill="none"
          stroke="url(#clipShade)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- ✨ Sparks de IA — 3 estrellas de 4 puntas en tamaños/posiciones distintas -->

  <!-- Spark grande arriba-derecha (el principal) -->
  <g transform="translate(490 165)" filter="url(#sparkGlow)">
    <path d="M 0 -38 L 9 -9 L 38 0 L 9 9 L 0 38 L -9 9 L -38 0 L -9 -9 Z"
          fill="url(#sparkColor)"/>
    <circle cx="0" cy="0" r="5" fill="#fff"/>
  </g>

  <!-- Spark mediano debajo-derecha del primero -->
  <g transform="translate(528 250) scale(0.5)" filter="url(#sparkGlow)">
    <path d="M 0 -38 L 9 -9 L 38 0 L 9 9 L 0 38 L -9 9 L -38 0 L -9 -9 Z"
          fill="url(#sparkColor)" opacity="0.9"/>
  </g>

  <!-- Spark chico arriba-izquierda del primero (acompaña) -->
  <g transform="translate(430 110) scale(0.32)" filter="url(#sparkGlow)">
    <path d="M 0 -38 L 9 -9 L 38 0 L 9 9 L 0 38 L -9 9 L -38 0 L -9 -9 Z"
          fill="url(#sparkColor)" opacity="0.8"/>
  </g>
</svg>
